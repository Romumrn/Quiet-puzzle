<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Neutral pastel, the colour of the web side's loading veil (.boot-veil in
       prototype/styles/main.css): the launch goes splash → veil or menu with no
       violet in between. Same as capacitor.config.json's backgroundColor and
       styles.xml's windowSplashScreenBackground. -->
  <rect width="1024" height="1024" fill="#f1ecf0"/>

  <g transform="translate(512 512) scale(0.55) translate(-493 -512)">
    <rect x="655" y="302" width="96" height="420" rx="48" fill="#4a3540"/>
    <rect x="235" y="325" width="190" height="190" rx="42" fill="#4f86e0" transform="rotate(-10 330 420)"/>
    <rect x="325" y="515" width="190" height="190" rx="42" fill="#eab454" transform="rotate(8 420 610)"/>
    <rect x="465" y="405" width="190" height="190" rx="42" fill="#e8546c" transform="rotate(-6 560 500)"/>
  </g>
</svg>
