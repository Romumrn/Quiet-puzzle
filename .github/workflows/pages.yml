# Déploiement GitHub Pages.
#
# Publie les sources MODULAIRES, et non le fichier unique. La raison est
# arithmétique : à six cents niveaux, la base pèse quatre méga-octets et le
# fichier unique six — quinze secondes d'attente en 4G avant de voir quoi que ce
# soit. Servi en modules, le jeu ouvre sur 388 Ko et ne charge un monde qu'au
# moment de le jouer.
#
# Le fichier unique reste fabriqué par `tools/bundle.mjs`, pour le partage hors
# ligne et l'ouverture par double-clic.
#
# Actif seulement si la source Pages du dépôt est réglée sur « GitHub Actions » ;
# avec la source « branche main /docs », c'est le contenu committé qui est servi.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests de la logique de jeu
        working-directory: prototype
        run: node tools/test.mjs

      - name: Préparer le site
        working-directory: prototype
        run: node tools/publier.mjs ../_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
