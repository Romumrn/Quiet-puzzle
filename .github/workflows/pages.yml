# Déploiement GitHub Pages.
#
# Le jeu ne se joue plus dans le navigateur : on y joue par l'app Android.
# Le site publié est la page d'accueil de `site/` — une présentation et un
# bouton vers Google Play — avec la politique de confidentialité et la page de
# suppression de compte, que la fiche Play Store et l'app pointent.
#
# Jamais `prototype/` ici : ce serait remettre le jeu en ligne.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Tests de la logique de jeu
        working-directory: prototype
        run: node tools/test.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
